name: XTend independent product gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        node: [24.18.0, 26.5.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        env:
          update: true
          use_package_cache: false
        with:
          php-version: 8.4
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, curl, zip
          tools: composer:2.10.3
      - name: Install supported display tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth unzip
          node scripts/provision-product-fpm.cjs 8.4
      - name: Install immutable Chromium and matching WebDriver
        run: node scripts/prepare-browser-toolchain.cjs "${{ runner.temp }}/xtend-browser"
      - name: Reproduce immutable Core candidate source and install verified tarballs
        run: node scripts/prepare-ci-candidates.cjs
      - name: Prepare required PHP and Electron runtimes
        run: node scripts/prepare-product-runtime.cjs
      - name: Run required product gates
        run: npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: independent-product-evidence-node-${{ matrix.node }}
          include-hidden-files: true
          path: |
            .xtend-test-results/
            .candidate-source/manifest.json
          if-no-files-found: error
